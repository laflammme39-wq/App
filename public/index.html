<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PouchMap — Nicotine Pouch Price Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">
      <div id="logo">
        <span class="logo-icon">📍</span>
        <span class="logo-text">PouchMap</span>
      </div>
      <p class="tagline">Nicotine pouch prices near you</p>
    </div>

    <!-- Search/Filter Panel -->
    <div id="filter-panel">
      <div class="panel-title">Filter &amp; Search</div>

      <div class="form-group">
        <label>Brand</label>
        <select id="filter-brand">
          <option value="">All Brands</option>
        </select>
      </div>

      <div class="form-group">
        <label>Product</label>
        <select id="filter-product">
          <option value="">All Products</option>
        </select>
      </div>

      <div class="form-group">
        <label>Max Price: $<span id="price-display">20</span></label>
        <input type="range" id="filter-price" min="1" max="20" value="20" step="0.25" />
      </div>

      <div class="form-group">
        <label>Store Type</label>
        <div class="type-filters">
          <label class="type-toggle"><input type="checkbox" class="store-type-cb" value="gas_station" checked /> ⛽ Gas Station</label>
          <label class="type-toggle"><input type="checkbox" class="store-type-cb" value="convenience_store" checked /> 🏪 Convenience</label>
          <label class="type-toggle"><input type="checkbox" class="store-type-cb" value="smoke_shop" checked /> 🚬 Smoke Shop</label>
        </div>
      </div>

      <button id="btn-search" class="btn btn-primary">Apply Filters</button>
      <button id="btn-reset" class="btn btn-ghost">Reset</button>
    </div>

    <!-- Location list -->
    <div id="location-list-panel">
      <div class="panel-title">
        Locations
        <span id="loc-count" class="badge">0</span>
      </div>
      <div id="location-list"></div>
    </div>
  </div>

  <!-- Map container -->
  <div id="map"></div>

  <!-- FAB: Add location -->
  <button id="fab-add" title="Add a store">+</button>

  <!-- Detail panel (slides up) -->
  <div id="detail-panel" class="hidden">
    <div id="detail-header">
      <div>
        <div id="detail-name"></div>
        <div id="detail-meta"></div>
      </div>
      <button id="detail-close" onclick="closeDetail()">✕</button>
    </div>

    <div id="detail-prices"></div>

    <div id="detail-actions">
      <button class="btn btn-primary" onclick="openReportModal()">+ Report Price</button>
      <button class="btn btn-danger" id="btn-delete-loc">Delete Location</button>
    </div>
  </div>

  <!-- Modal: Add Location -->
  <div id="modal-add-loc" class="modal hidden">
    <div class="modal-box">
      <div class="modal-title">Add a Store</div>
      <div class="form-group">
        <label>Store Name *</label>
        <input type="text" id="loc-name" placeholder="e.g. QuikTrip #142" />
      </div>
      <div class="form-group">
        <label>Type *</label>
        <select id="loc-type">
          <option value="gas_station">⛽ Gas Station</option>
          <option value="convenience_store">🏪 Convenience Store</option>
          <option value="smoke_shop">🚬 Smoke Shop</option>
        </select>
      </div>
      <div class="form-group">
        <label>Address</label>
        <input type="text" id="loc-address" placeholder="Optional address" />
      </div>
      <div class="form-group hint">Click on the map to set the pin location, or enter manually:</div>
      <div class="coord-row">
        <div class="form-group">
          <label>Latitude *</label>
          <input type="number" id="loc-lat" step="any" placeholder="40.7128" />
        </div>
        <div class="form-group">
          <label>Longitude *</label>
          <input type="number" id="loc-lng" step="any" placeholder="-74.0060" />
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeAddLocModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitAddLocation()">Add Store</button>
      </div>
    </div>
  </div>

  <!-- Modal: Report Price -->
  <div id="modal-report" class="modal hidden">
    <div class="modal-box">
      <div class="modal-title">Report a Price</div>
      <div class="form-group">
        <label>Brand</label>
        <select id="report-brand"></select>
      </div>
      <div class="form-group">
        <label>Product</label>
        <select id="report-product"></select>
      </div>
      <div class="form-group">
        <label>Price ($) *</label>
        <input type="number" id="report-price" step="0.01" min="0.01" placeholder="4.99" />
      </div>
      <div class="form-group">
        <label>Your Name (optional)</label>
        <input type="text" id="report-user" placeholder="Anonymous" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeReportModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitReport()">Submit</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
